<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">

<meta property="og:url" content="https://krog4206941.github.io/grokbutt-halloween-pfp/">

<meta name="twitter:description" content="Dress up GrokButt or haunt your own PFP. Free, in-browser, no uploads. Trick or Crop?">

<body>
<header class="top">
  <div class="brand"><img src="favicon.png" alt="" width="40" height="40"><div><h1>GROKBUTT <span>Halloween PFP Maker</span></h1><p class="tag">Trick or Crop? 28 costumes, zero limbs.</p></div></div>
</header>
<main class="app">
  <section class="stage">
    <div class="tabs mode" role="tablist">
      <button id="modeDress" class="on" role="tab" data-mode="dress">🎃 Dress up GrokButt</button>
      <button id="modeUpload" role="tab" data-mode="upload">🦇 Haunt my PFP</button>
    </div>
    <div class="canvasWrap" id="wrap"><canvas id="view" width="1000" height="1000" aria-label="PFP preview"></canvas><div class="hint" id="hint"></div></div>
    <div class="stageBar">
      <label class="circle"><input type="checkbox" id="circleToggle"> Circle crop preview</label>
      <canvas id="mini" width="96" height="96" title="How it looks on your timeline"></canvas>
    </div>
    <div class="actions">
      <button id="randomBtn" class="ghost">🎲 Randomize</button>
      <button id="downloadBtn" class="primary">⬇ Download PNG</button>
    </div>
    <p class="fine">1000×1000 PNG. Everything happens in your browser: no server, no uploads.</p>
  </section>
  <section class="panel">
    <div class="tabs cats" id="cats"></div>
    <div id="panelBody" class="panelBody"></div>
  </section>
</main>
<input type="file" id="fileIn" accept="image/*" hidden>
<div class="modal" id="modal" hidden><div class="sheet"><img id="outImg" alt="Your GrokButt PFP"><p>Saved! On a phone, long-press the image to save it to Photos.</p><div class="row"><button id="shareBtn" class="ghost" hidden>Share</button><button id="closeModal" class="primary">Back to haunting</button></div></div></div>
<div class="toast" id="toast"></div>
<footer>Made by Krog &amp; Grok Bot · <span class="lore">No humans were cropped in the making of this PFP.</span></footer>
<script src="meta.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
